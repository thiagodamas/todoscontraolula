<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urnas · Rio Grande do Sul</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #1c1c1c;
    --muted: #5c6570;
    --line: #e3e6ea;
    --paper: #f6f7f8;
    --menu-altura: 52px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  #mapa {
    position: absolute;
    top: var(--menu-altura);
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 0;
    width: auto;
    height: auto;
    background: #d9dee4;
  }
  .menu {
    position: absolute;
    z-index: 800;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: white;
    border-bottom: 1px solid var(--line);
  }
  .menu button[data-tela] {
    flex: none;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--line);
    background: white;
    color: var(--ink);
    border-radius: 99px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .menu button[data-tela].ativa { background: var(--ink); color: white; border-color: var(--ink); }
  .menu-filtros { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .menu-filtros label { flex-direction: row; align-items: center; white-space: nowrap; }
  .menu select, .menu input[type="search"] { min-width: 132px; font-size: 13px; padding: 5px 8px; }
  .menu input[type="search"] { width: 148px; }
  #dados, #horario {
    display: none;
    position: absolute;
    z-index: 700;
    top: var(--menu-altura);
    right: 0;
    bottom: 0;
    left: 0;
    overflow: auto;
    background: var(--paper);
    padding: 18px 22px 48px;
  }
  .histograma {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 320px;
    margin: 18px 0 8px;
    padding: 8px 4px 0;
  }
  .histograma .col { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; }
  .histograma .eixo { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .histograma .valor { font-size: 11px; color: var(--muted); height: 16px; }
  .histograma .barra {
    width: 100%;
    max-width: 48px;
    display: flex;
    flex-direction: column-reverse;
    border-radius: 6px 6px 0 0;
    overflow: hidden;
  }
  .histograma .pedaco { display: block; width: 100%; }
  .histograma .pedaco.bio { background: #0f766e; }
  .histograma .pedaco.sem { background: #b86e00; }
  .histograma .pedaco.man { background: #6b2d5b; }
  .histograma .pedaco.out { background: #243044; }
  .histograma .rotulo { margin-top: 6px; font-size: 12px; color: var(--ink); }
  .histograma .rotulo.depois { color: #1d4e89; }
  .histograma .col.pico .rotulo { font-weight: 700; }
  .histograma.compacto { height: 168px; gap: 3px; margin: 8px 0 4px; }
  .histograma.compacto .barra { max-width: 28px; }
  .histograma.compacto .rotulo { font-size: 10px; }
  .histograma.compacto .valor { font-size: 10px; }
  .legenda-hora { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 8px 0 0; font-size: 12px; }
  .legenda-hora i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .ficha .tabela-hora tbody tr { cursor: default; }
  .ficha .tabela-hora { margin-top: 4px; }
  body.tela-dados #dados, body.tela-hora #horario { display: block; }
  body.tela-dados .barra-topo, body.tela-dados aside,
  body.tela-hora .barra-topo, body.tela-hora aside { display: none !important; }
  #dados h1, #horario h1 { margin: 0 0 6px; font-size: 22px; }
  #dados table, #horario table { background: white; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #dados th, #horario th { position: sticky; top: 0; background: white; }
  #dados tbody tr { cursor: pointer; }
  #dados tbody tr:hover { background: #f4f7fb; }
  .barra-topo {
    position: absolute;
    z-index: 500;
    top: calc(var(--menu-altura) + 12px);
    left: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px;
    max-width: min(780px, calc(100vw - 24px));
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 12px;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.16);
  }
  .titulo { flex: 1 1 220px; min-width: 180px; }
  .titulo strong { display: block; font-size: 15px; }
  .titulo span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .legenda { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0; font-size: 13px; flex: 1 1 100%; }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 99px; margin-right: 4px; vertical-align: -1px; }
  .filtro-mapa {
    flex: 1 1 100%;
    margin: 2px 0 0;
    padding: 0;
    border: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    align-items: center;
  }
  .filtro-mapa legend { font-size: 12px; color: var(--muted); padding: 0; }
  .filtro-mapa label {
    flex-direction: row;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .filtro-mapa input { margin: 0; }
  aside {
    display: none;
    position: absolute;
    z-index: 600;
    top: calc(var(--menu-altura) + 12px);
    right: 12px;
    bottom: 12px;
    width: min(440px, calc(100vw - 24px));
    overflow: auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.16);
    padding: 14px 14px 28px;
  }
  body.painel-aberto aside { display: block; }
  .fechar {
    position: sticky;
    top: 0;
    float: right;
    z-index: 2;
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--line);
    background: white;
    border-radius: 99px;
    padding: 4px 8px;
    cursor: pointer;
  }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  select, input[type="search"] {
    font: inherit;
    font-size: 14px;
    padding: 7px 8px;
    border: 1px solid #cfd5dc;
    border-radius: 6px;
    background: white;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th.texto, td.texto { text-align: left; }
  #dados th.texto, #dados td.texto { white-space: normal; max-width: 320px; }
  .nota { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .aviso { background: #fff6e8; border: 1px solid #f0d7a8; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
  .numeros { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .numeros div { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 120px; }
  .numeros strong { display: block; font-size: 18px; }
  .numeros span { color: var(--muted); font-size: 12px; }
  .ficha h2 { margin: 0 28px 4px 0; font-size: 18px; }
  .ficha p { margin: 6px 0; line-height: 1.4; }
  .ficha table { margin-top: 8px; font-size: 12px; }
  .ficha th, .ficha td { padding: 5px 4px; }
  .ficha tbody tr { cursor: pointer; }
  .ficha tr.ativa { background: #f4f0f6; }
  .tag { display: inline-block; margin: 2px 4px 0 0; padding: 2px 7px; border-radius: 99px; background: #f3e8f5; font-size: 12px; }
  @media (max-width: 700px) {
    .barra-topo { right: 12px; max-width: none; }
    aside { left: 12px; width: auto; }
    .menu-filtros { margin-left: 0; }
    .col-pct { display: none; }
    #horario th, #horario td, .ficha .tabela-hora th, .ficha .tabela-hora td { padding: 4px 3px; font-size: 11px; }
  }
</style>
</head>
<body>
<nav class="menu" id="menu">
  <button type="button" data-tela="mapa" class="ativa">Mapa</button>
  <button type="button" data-tela="hora">Horário</button>
  <button type="button" data-tela="lista">Seções que divergem</button>
  <div class="menu-filtros">
    <label>Recorte
      <select id="cidade">
        <option value="">Todo o Rio Grande do Sul</option>
        <option value="sul">Sul do estado</option>
      </select>
    </label>
    <label>Buscar
      <input id="busca" type="search" placeholder="Buscar">
    </label>
  </div>
</nav>
<div id="mapa"></div>
<div class="barra-topo">
  <div class="titulo">
    <strong>Urnas no Rio Grande do Sul</strong>
    <span id="frase">1º turno de 2026. Cada círculo é uma seção.</span>
  </div>
  <p class="legenda" id="legenda"></p>
  <fieldset class="filtro-mapa">
    <legend>No mapa</legend>
    <label><input type="radio" name="filtro-mapa" value="ambas" checked> Situação e abstenção</label>
    <label><input type="radio" name="filtro-mapa" value="sit"> Situação fora da média</label>
    <label><input type="radio" name="filtro-mapa" value="abs"> Abstenção fora da média</label>
    <label><input type="radio" name="filtro-mapa" value="todas"> Todas as seções</label>
  </fieldset>
  <p class="nota" id="nota-filtro"></p>
</div>
<aside id="ficha" class="ficha"></aside>
<div id="horario">
  <h1>Votos por horário</h1>
  <p class="nota" id="hora-nota"></p>
  <div class="legenda-hora" id="hora-legenda"></div>
  <div class="histograma" id="histograma"></div>
  <p class="nota" id="hora-resumo"></p>
  <table>
    <thead>
      <tr>
        <th class="texto">Hora</th>
        <th>Digital</th>
        <th>S/cad.</th>
        <th>Manual</th>
        <th>Votos</th>
        <th class="col-pct">% do dia</th>
        <th class="col-pct">% acumulado</th>
      </tr>
    </thead>
    <tbody id="hora-corpo"></tbody>
  </table>
</div>
<div id="dados">
  <h1>Seções que divergem</h1>
  <p class="nota" id="regra"></p>
  <div class="numeros" id="numeros"></div>
  <p class="aviso" id="aviso-lista"></p>
  <p class="nota" id="resumo-lista"></p>
  <table>
    <thead>
      <tr>
        <th class="texto">Local</th>
        <th>Seção</th>
        <th>Aptos</th>
        <th>Abstenção</th>
        <th>Digital</th>
        <th>Sem cadastro</th>
        <th>Manual</th>
        <th>Após 17h</th>
        <th class="texto">O que foge</th>
      </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="urnas.js"></script>
<script>
const U = window.URNAS;
const SIT = 30;
const CORES = { man: "#6b2d5b", sem: "#b86e00", apos: "#1d4e89", bio: "#0f766e", absAlta: "#8a4b08", absBaixa: "#0f766e", neutro: "#c5ced6" };
const NOMES = { man: "liberação manual", sem: "sem cadastro", bio: "biometria", apos: "votos após 17h" };
const cidadeEl = document.querySelector("#cidade");
const buscaEl = document.querySelector("#busca");
const mapa = L.map("mapa", { scrollWheelZoom: true, zoomControl: false, preferCanvas: true });
L.control.zoom({ position: "bottomleft" }).addTo(mapa);
const atr = "Tiles &copy; Esri";
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 18, maxNativeZoom: 16, attribution: atr
}).addTo(mapa);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 18, maxNativeZoom: 16
}).addTo(mapa);
const camada = L.layerGroup().addTo(mapa);
const marcadores = new Map();
let selecionado = null;
let maxAptos = 1;

function idDe(s) { return s.c + "|" + s.z + "|" + s.s; }
function secaoPalavra(n) {
  return n.toLocaleString("pt-BR") + (n === 1 ? " seção" : " seções");
}
function radio() { return document.querySelector("input[name=filtro-mapa]:checked").value; }
function num(v) { return (v || 0).toLocaleString("pt-BR"); }
function pct(parte, total) {
  if (!total) return "–";
  return (100 * parte / total).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
}
function ztxt(z) {
  if (z == null) return "–";
  const texto = Math.abs(z).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  return (z > 0 ? "+" : "−") + texto;
}
function misturar(a, b, t) {
  const ler = (cor) => [1, 3, 5].map((i) => parseInt(cor.slice(i, i + 2), 16));
  const pa = ler(a);
  const pb = ler(b);
  return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function buscaTexto(s) {
  return (s.c + " " + s.n + " " + s.b + " " + s.z + " " + s.s).toLocaleLowerCase("pt-BR");
}
function noRecorte(s) {
  const cidade = cidadeEl.value;
  if (cidade === "sul" && !s.sul) return false;
  if (cidade && cidade !== "sul" && s.c !== cidade) return false;
  const q = buscaEl.value.trim().toLocaleLowerCase("pt-BR");
  return !q || buscaTexto(s).includes(q);
}
function noFiltro(s) {
  if (!noRecorte(s) || s.lat == null) return false;
  const modo = radio();
  const sit = s.f & SIT;
  const abs = s.f & 1;
  if (modo === "ambas") return sit && abs;
  if (modo === "sit") return Boolean(sit);
  if (modo === "abs") return Boolean(abs);
  return true;
}
function listaDivergente() {
  return U.secoes.filter((s) => noRecorte(s) && (s.f & 1) && (s.f & SIT));
}
function fraseDe(s) {
  const partes = [];
  if (s.f & 1) partes.push((s.zabs > 0 ? "abstenção alta" : "abstenção baixa") + " (" + ztxt(s.zabs) + ")");
  ["man", "sem", "apos", "bio"].forEach((nome) => {
    const bit = { man: 2, sem: 4, apos: 16, bio: 8 }[nome];
    const z = s["z" + nome];
    if (!(s.f & bit) || z == null) return;
    const lado = z > 0 ? "alta" : "baixa";
    const rotulo = nome === "apos" ? (z > 0 ? "muitos votos após 17h" : "quase nenhum voto após 17h") : NOMES[nome] + " " + lado;
    partes.push(rotulo + " (" + ztxt(z) + ")");
  });
  return partes.join("; ");
}
function corDe(s) {
  const modo = radio();
  if (modo === "todas" || modo === "abs") {
    if (s.zabs == null) return CORES.neutro;
    const t = Math.max(-4, Math.min(4, s.zabs)) / 4;
    return t >= 0 ? misturar("#d7dee4", CORES.absAlta, t) : misturar("#d7dee4", CORES.absBaixa, -t);
  }
  let melhor = null;
  [["man", 2, CORES.man], ["sem", 4, CORES.sem], ["apos", 16, CORES.apos], ["bio", 8, CORES.bio]].forEach(([nome, bit, cor]) => {
    const z = s["z" + nome];
    if ((s.f & bit) && z != null && (melhor == null || Math.abs(z) > Math.abs(melhor.z))) melhor = { z, cor };
  });
  return melhor ? melhor.cor : CORES.neutro;
}
function estilo(s) {
  const cor = corDe(s);
  const ativo = selecionado && idDe(selecionado) === idDe(s);
  const contornoSituacao = (radio() === "todas" || radio() === "abs") && (s.f & SIT);
  return {
    radius: 4 + 12 * Math.sqrt((s.aptos || s.votos || 1) / maxAptos),
    color: ativo ? "#111111" : (contornoSituacao ? "#6b2d5b" : cor),
    weight: ativo ? 3 : (contornoSituacao ? 2 : 1),
    fillColor: cor,
    fillOpacity: 0.9
  };
}
function pintarLegenda() {
  const modo = radio();
  const item = (cor, texto) => "<span><i style=\"background:" + cor + "\"></i>" + texto + "</span>";
  if (modo === "todas" || modo === "abs") {
    document.querySelector("#legenda").innerHTML = [
      item(CORES.absBaixa, "abstenção baixa"),
      item(CORES.neutro, "perto da média"),
      item(CORES.absAlta, "abstenção alta"),
      item("#6b2d5b", "contorno: uma situação também foge")
    ].join("");
    return;
  }
  document.querySelector("#legenda").innerHTML = [
    item(CORES.man, "liberação manual"),
    item(CORES.sem, "sem cadastro"),
    item(CORES.apos, "após 17h"),
    item(CORES.bio, "biometria")
  ].join("");
}
function encaixarMapa() {
  const altura = document.querySelector("#menu").offsetHeight;
  document.documentElement.style.setProperty("--menu-altura", altura + "px");
  mapa.invalidateSize();
}
function posicoes(lista) {
  const grupos = new Map();
  lista.forEach((s) => {
    const chave = s.c + "|" + s.z + "|" + s.loc;
    if (!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(s);
  });
  const coords = new Map();
  grupos.forEach((grupo) => {
    grupo.forEach((s, i) => {
      if (grupo.length === 1) {
        coords.set(idDe(s), [s.lat, s.lon]);
        return;
      }
      const ang = (i / grupo.length) * Math.PI * 2;
      const passo = 0.00011 * (1 + Math.floor(i / 10));
      const lat = s.lat + Math.cos(ang) * passo;
      const lon = s.lon + Math.sin(ang) * passo / Math.cos(s.lat * Math.PI / 180);
      coords.set(idDe(s), [lat, lon]);
    });
  });
  return coords;
}
function desenhar(enquadrar) {
  const visiveis = U.secoes.filter(noFiltro);
  const coords = posicoes(visiveis);
  camada.clearLayers();
  marcadores.clear();
  maxAptos = 1;
  visiveis.forEach((s) => { if ((s.aptos || 0) > maxAptos) maxAptos = s.aptos; });
  visiveis.forEach((s) => {
    const ponto = coords.get(idDe(s));
    const marker = L.circleMarker(ponto, estilo(s));
    marker.on("click", () => selecionar(s, false));
    marker.addTo(camada);
    marcadores.set(idDe(s), marker);
  });
  const modo = radio();
  const nomes = { ambas: "situação e abstenção", sit: "situação fora da média", abs: "abstenção fora da média", todas: "todas as seções" };
  let extra = "";
  if (!visiveis.length && modo === "ambas") {
    const sit = U.secoes.filter((s) => noRecorte(s) && (s.f & SIT)).length;
    const abs = U.secoes.filter((s) => noRecorte(s) && (s.f & 1)).length;
    extra = " Nenhuma seção deste recorte foge das duas médias ao mesmo tempo. Há " +
      secaoPalavra(sit) + " com situação fora da média e " +
      secaoPalavra(abs) + " com abstenção fora da média.";
  }
  document.querySelector("#nota-filtro").textContent = secaoPalavra(visiveis.length) + " no mapa · " + nomes[modo] + "." + extra;
  pintarLegenda();
  if (!enquadrar) return;
  if (!visiveis.length) {
    mapa.setView([-30.8, -53.2], 7);
    return;
  }
  const barra = document.querySelector(".barra-topo");
  const topo = barra && barra.offsetParent ? barra.getBoundingClientRect().bottom + 16 : 140;
  mapa.fitBounds(visiveis.map((s) => coords.get(idDe(s))), { paddingTopLeft: [24, topo], paddingBottomRight: [24, 24] });
}
function taxaMun(mun, nome) {
  if (mun[nome] == null) return "–";
  return pct(Math.round(mun[nome] * 1000), 1000);
}
function textoContexto(codigo, assunto) {
  if (codigo === 1) return "Na " + assunto + ", só esta seção do local fica deste lado da média.";
  if (codigo === 2) return "Na " + assunto + ", as outras seções deste local também ficam deste lado.";
  if (codigo === 3) return "Na " + assunto + ", parte das seções deste local fica deste lado.";
  return "";
}
function selecionar(s, voar) {
  const antes = selecionado;
  selecionado = s;
  if (antes && marcadores.has(idDe(antes))) marcadores.get(idDe(antes)).setStyle(estilo(antes));
  if (marcadores.has(idDe(s))) marcadores.get(idDe(s)).setStyle(estilo(s));
  pintarFicha(s);
  document.body.classList.add("painel-aberto");
  if (voar && s.lat != null) mapa.setView([s.lat, s.lon], 16);
}
function pintarFicha(s) {
  const irmas = U.secoes.filter((item) => item.c === s.c && item.z === s.z && item.loc === s.loc);
  const mun = U.municipios[s.c] || {};
  const linhas = irmas.map((item) => {
    const ativa = idDe(item) === idDe(s) ? " class=\"ativa\"" : "";
    return "<tr" + ativa + " data-id=\"" + idDe(item) + "\">" +
      "<td class=\"texto\">" + item.s + "</td>" +
      "<td>" + num(item.aptos) + "</td>" +
      "<td>" + pct(item.falt, item.aptos) + "</td>" +
      "<td>" + pct(item.bio, item.votos) + "</td>" +
      "<td>" + pct(item.sem, item.votos) + "</td>" +
      "<td>" + pct(item.man, item.cad) + "</td>" +
      "<td>" + pct(item.apos, item.votos) + "</td></tr>";
  }).join("");
  const base = mun.base_abs === "estado" ? "do estado" : "do município";
  const notas = [];
  if (s.f & 1) notas.push(textoContexto(s.ca, "abstenção"));
  if (s.f & SIT) notas.push(textoContexto(s.cs, "situação"));
  if (s.seq >= 8) notas.push("Maior sequência de liberações manuais seguidas: " + s.seq + ".");
  if (s.dif > 5) notas.push("O log registra " + num(s.votos) + " votos e o boletim registra " + num(s.comp) + ". Esta seção fica de fora da comparação de habilitação e de horário.");
  if (s.lat == null) notas.push("Esta seção não tem coordenada no cadastro e fica fora do mapa.");
  document.querySelector("#ficha").innerHTML =
    "<button type=\"button\" class=\"fechar\" id=\"fechar\">Fechar</button>" +
    "<h2>" + (s.n || "Seção " + s.s) + "</h2>" +
    "<p class=\"nota\">" + s.c + " · zona " + s.z + " · seção " + s.s + (s.b ? " · " + s.b : "") + "</p>" +
    "<p class=\"nota\">" + (s.e || "") + (s.apx ? " Coordenada aproximada." : "") + "</p>" +
    htmlHorario([s], 120, true) +
    "<p>" + fraseDe(s) + "</p>" +
    "<p class=\"nota\">No município, a abstenção é " + taxaMun(mun, "abs") +
      ", a digital " + taxaMun(mun, "bio") +
      ", sem cadastro " + taxaMun(mun, "sem") +
      ", a liberação manual " + taxaMun(mun, "man") +
      " e os votos após 17h " + taxaMun(mun, "apos") +
      ". A comparação da abstenção usa a taxa " + base + ".</p>" +
    notas.filter(Boolean).map((t) => "<p>" + t + "</p>").join("") +
    "<table><thead><tr><th class=\"texto\">Seção</th><th>Aptos</th><th>Abst.</th><th>Digital</th><th>S/cad.</th><th>Manual</th><th>17h</th></tr></thead><tbody id=\"ficha-irmas\">" +
    linhas + "</tbody></table>";
  document.querySelector("#fechar").onclick = () => {
    selecionado = null;
    document.body.classList.remove("painel-aberto");
    desenhar(false);
  };
  document.querySelectorAll("#ficha-irmas tr").forEach((tr) => {
    tr.onclick = () => {
      const alvo = irmas.find((item) => idDe(item) === tr.dataset.id);
      if (alvo) selecionar(alvo, true);
    };
  });
}
function pintarNumeros() {
  const t = U.totais;
  const bloco = (valor, rotulo) => "<div><strong>" + valor + "</strong><span>" + rotulo + "</span></div>";
  document.querySelector("#numeros").innerHTML = [
    bloco(pct(t.bio, t.votos), "digital"),
    bloco(pct(t.sem, t.votos), "sem cadastro"),
    bloco(pct(t.man, t.votos), "liberação manual"),
    bloco(pct(t.apos, t.votos), "votos após 17h"),
    bloco(pct(t.faltaram, t.aptos), "abstenção")
  ].join("");
}
function pintarLista() {
  const linhas = listaDivergente().sort((a, b) => {
    const sa = Math.abs(a.zabs || 0) + Math.abs(a.zsmax || 0);
    const sb = Math.abs(b.zabs || 0) + Math.abs(b.zsmax || 0);
    return sb - sa || b.aptos - a.aptos;
  });
  document.querySelector("#resumo-lista").textContent = secaoPalavra(linhas.length) +
    " neste recorte. No estado, " + secaoPalavra(U.totais.divergem) +
    " fogem da média da abstenção e, ao mesmo tempo, de pelo menos uma situação.";
  const semCoord = linhas.filter((s) => s.lat == null).length;
  document.querySelector("#aviso-lista").hidden = semCoord === 0;
  document.querySelector("#aviso-lista").textContent = semCoord
    ? semCoord.toLocaleString("pt-BR") + " seções desta lista não têm coordenada e ficam fora do mapa."
    : "";
  document.querySelector("#corpo").innerHTML = linhas.map((s) =>
    "<tr data-id=\"" + idDe(s) + "\">" +
    "<td class=\"texto\">" + s.c + " · " + (s.n || "sem nome") + "</td>" +
    "<td>" + s.z + " / " + s.s + "</td>" +
    "<td>" + num(s.aptos) + "</td>" +
    "<td>" + pct(s.falt, s.aptos) + " <span class=\"nota\">" + ztxt(s.zabs) + "</span></td>" +
    "<td>" + pct(s.bio, s.votos) + "</td>" +
    "<td>" + pct(s.sem, s.votos) + "</td>" +
    "<td>" + pct(s.man, s.cad) + "</td>" +
    "<td>" + pct(s.apos, s.votos) + "</td>" +
    "<td class=\"texto\">" + fraseDe(s) + "</td></tr>"
  ).join("");
  document.querySelectorAll("#corpo tr").forEach((tr) => {
    tr.onclick = () => {
      const s = U.secoes.find((item) => idDe(item) === tr.dataset.id);
      mostrarTela("mapa");
      selecionar(s, true);
      desenhar(false);
    };
  });
}
const TIPOS_HORA = [
  { chave: "bio", nome: "digital" },
  { chave: "sem", nome: "sem cadastro" },
  { chave: "man", nome: "manual" },
  { chave: "out", nome: "outro" }
];
function parteHora(valor) {
  if (Array.isArray(valor)) {
    return { bio: valor[0] || 0, sem: valor[1] || 0, man: valor[2] || 0, out: valor[3] || 0 };
  }
  return { bio: valor || 0, sem: 0, man: 0, out: 0 };
}
function totalHora(p) {
  return p.bio + p.sem + p.man + p.out;
}
function somarHoras(lista) {
  const soma = Array.from({ length: 24 }, () => ({ bio: 0, sem: 0, man: 0, out: 0 }));
  lista.forEach((s) => {
    if (!s.h) return;
    s.h.forEach((q, hora) => {
      const p = parteHora(q);
      soma[hora].bio += p.bio;
      soma[hora].sem += p.sem;
      soma[hora].man += p.man;
      soma[hora].out += p.out;
    });
  });
  return { soma, votos: soma.reduce((a, p) => a + totalHora(p), 0) };
}
function horasDoRecorte() {
  return somarHoras(U.secoes.filter(noRecorte));
}
function legendaHoraHtml() {
  return TIPOS_HORA.filter((t) => t.chave !== "out").map((t) =>
    "<span><i style=\"background:" + CORES[t.chave] + "\"></i>" + t.nome + "</span>"
  ).join("");
}
function pedacosDe(partes, altura) {
  const ordem = { bio: 0, sem: 1, man: 2, out: 3 };
  const itens = TIPOS_HORA.map((t) => ({ chave: t.chave, q: partes[t.chave] })).filter((p) => p.q > 0);
  if (!itens.length || altura <= 0) return [];
  const soma = itens.reduce((a, p) => a + p.q, 0);
  itens.forEach((p) => { p.h = Math.floor(altura * p.q / soma); });
  let resto = altura - itens.reduce((a, p) => a + p.h, 0);
  const maiores = itens.slice().sort((a, b) => b.q - a.q);
  for (let i = 0; resto > 0; i = (i + 1) % maiores.length) {
    maiores[i].h += 1;
    resto -= 1;
  }
  return itens.filter((p) => p.h > 0).sort((a, b) => ordem[a.chave] - ordem[b.chave]);
}
function desenharBarras(soma, votos, alturaMax) {
  const totais = soma.map(totalHora);
  let inicio = totais.findIndex((q) => q > 0);
  let fim = totais.length - 1;
  while (fim > 0 && totais[fim] === 0) fim -= 1;
  if (inicio < 0) return { html: "", inicio: 0, fim: -1, horaPico: -1, depois: 0, votos: 0, soma };
  const pico = Math.max(1, ...totais.slice(inicio, fim + 1));
  const horaPico = totais.indexOf(Math.max(...totais));
  const depois = totais.slice(17).reduce((a, b) => a + b, 0);
  const html = totais.slice(inicio, fim + 1).map((q, i) => {
    const hora = inicio + i;
    const partes = soma[hora];
    const altura = q > 0 ? Math.max(2, Math.round(alturaMax * q / pico)) : 0;
    const pedacos = altura ? pedacosDe(partes, altura) : [];
    const titulo = hora + "h · " + num(q) + " votos · digital " + num(partes.bio) +
      " · sem cadastro " + num(partes.sem) + " · manual " + num(partes.man);
    return "<div class=\"" + (hora === horaPico ? "col pico" : "col") + "\">" +
      "<span class=\"valor\">" + (hora === horaPico && votos ? pct(q, votos) : "") + "</span>" +
      "<div class=\"eixo\">" + (altura
        ? "<div class=\"barra\" style=\"height:" + altura + "px\" title=\"" + titulo + "\">" +
          pedacos.map((p) => "<span class=\"pedaco " + p.chave + "\" style=\"height:" + p.h + "px\"></span>").join("") +
          "</div>"
        : "") + "</div>" +
      "<span class=\"rotulo" + (hora >= 17 ? " depois" : "") + "\">" + hora + "h</span></div>";
  }).join("");
  return { html, inicio, fim, horaPico, depois, votos, soma };
}
function linhasHora(grafico, completa) {
  if (grafico.fim < grafico.inicio) return "";
  let acumulado = 0;
  for (let hora = 0; hora < grafico.inicio; hora += 1) acumulado += totalHora(grafico.soma[hora]);
  let html = "";
  for (let hora = grafico.inicio; hora <= grafico.fim; hora += 1) {
    const p = grafico.soma[hora];
    const q = totalHora(p);
    acumulado += q;
    const faixa = hora + "h–" + (hora + 1) + "h";
    html += "<tr><td class=\"texto\">" + faixa + "</td><td>" + num(p.bio) + "</td><td>" +
      num(p.sem) + "</td><td>" + num(p.man) + "</td><td>" + num(q) + "</td>" +
      (completa ? "<td class=\"col-pct\">" + pct(q, grafico.votos) + "</td><td class=\"col-pct\">" + pct(acumulado, grafico.votos) + "</td>" : "") +
      "</tr>";
  }
  return html;
}
function textoResumo(grafico, vazio) {
  if (!grafico.votos) return vazio;
  const q = totalHora(grafico.soma[grafico.horaPico]);
  const nome = grafico.horaPico + "h–" + (grafico.horaPico + 1) + "h";
  return "O maior movimento foi entre " + nome + ", com " + num(q) + " votos (" + pct(q, grafico.votos) +
    "). Depois das 17h, " + num(grafico.depois) + " votos (" + pct(grafico.depois, grafico.votos) + ").";
}
function htmlHorario(lista, altura, secao) {
  const serie = somarHoras(lista);
  const grafico = desenharBarras(serie.soma, serie.votos, altura);
  const vazio = secao
    ? "Esta seção não tem horário de voto no log."
    : "Nenhuma seção deste recorte tem horário de voto no log.";
  const tabela = grafico.fim < grafico.inicio ? "" :
    "<table class=\"tabela-hora\"><thead><tr><th class=\"texto\">Hora</th><th>Digital</th><th>S/cad.</th><th>Manual</th><th>Votos</th></tr></thead><tbody>" +
    linhasHora(grafico, false) + "</tbody></table>";
  return "<div class=\"legenda-hora\">" + legendaHoraHtml() + "</div>" +
    "<div class=\"histograma compacto\">" + grafico.html + "</div>" +
    "<p class=\"nota\">" + textoResumo(grafico, vazio) + "</p>" + tabela;
}
function pintarHistograma() {
  const serie = horasDoRecorte();
  const grafico = desenharBarras(serie.soma, serie.votos, 250);
  const cidade = cidadeEl.value;
  const recorte = cidade === "sul" ? "no sul do estado" : cidade ? "em " + cidade : "no Rio Grande do Sul";
  document.querySelector("#hora-nota").textContent = "Cada barra reúne os votos computados naquela hora, " +
    recorte + ", empilhados por digital, sem cadastro e liberação manual. O relógio é o da urna. Das 17h em diante estão os votos de quem já estava na fila.";
  document.querySelector("#hora-legenda").innerHTML = legendaHoraHtml();
  document.querySelector("#histograma").innerHTML = grafico.html;
  document.querySelector("#hora-corpo").innerHTML = linhasHora(grafico, true);
  document.querySelector("#hora-resumo").textContent = textoResumo(grafico, "Nenhuma seção deste recorte tem horário de voto no log.");
}
function mostrarTela(nome) {
  document.body.classList.toggle("tela-dados", nome === "lista");
  document.body.classList.toggle("tela-hora", nome === "hora");
  document.querySelectorAll("#menu button[data-tela]").forEach((botao) => {
    botao.classList.toggle("ativa", botao.dataset.tela === nome);
  });
  if (nome === "lista") pintarLista();
  else if (nome === "hora") pintarHistograma();
  else {
    encaixarMapa();
    desenhar(false);
  }
}
function preencherCidades() {
  const cidades = [...new Set(U.secoes.map((s) => s.c))].sort((a, b) => a.localeCompare(b, "pt"));
  cidades.forEach((cidade) => {
    const option = document.createElement("option");
    option.value = cidade;
    option.textContent = cidade;
    cidadeEl.appendChild(option);
  });
}
document.querySelector("#regra").textContent =
  "Uma seção entra nesta lista quando o desvio absoluto chega a 3 ou mais, ao mesmo tempo, na abstenção e em pelo menos uma situação: digital reconhecida, eleitor sem cadastro biométrico, liberação manual pelo mesário ou voto computado depois das 17h. A comparação é com as outras seções do mesmo município e leva em conta o tamanho da seção. Município com menos de 8 seções comparáveis usa a taxa do estado. Entram seções com pelo menos 50 aptos na abstenção, 80 votos no log nas outras taxas e 40 eleitores com digital cadastrada na liberação manual. Seções em que o log não fecha com o boletim, com diferença acima de 5 votos, ficam de fora das taxas de habilitação e de horário. Votar depois das 17h vale para quem já estava na fila. A liberação pelo mesário é o caminho previsto quando a digital cadastrada não é reconhecida em quatro tentativas. A lista mede distância da média.";
preencherCidades();
pintarNumeros();
document.querySelectorAll("#menu button[data-tela]").forEach((botao) => {
  botao.onclick = () => mostrarTela(botao.dataset.tela);
});
document.querySelectorAll("input[name=filtro-mapa]").forEach((input) => {
  input.onchange = () => desenhar(true);
});
cidadeEl.onchange = () => {
  if (document.body.classList.contains("tela-dados")) pintarLista();
  if (document.body.classList.contains("tela-hora")) pintarHistograma();
  desenhar(true);
};
buscaEl.oninput = () => {
  if (document.body.classList.contains("tela-dados")) pintarLista();
  if (document.body.classList.contains("tela-hora")) pintarHistograma();
  desenhar(true);
};
window.addEventListener("resize", encaixarMapa);
encaixarMapa();
desenhar(true);
</script>
